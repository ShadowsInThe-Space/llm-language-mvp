name: Milestone release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: milestone-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/release_gate.py --repository "$GH_REPO" --mode release
  validation:
    needs: gate
    uses: ./.github/workflows/compatibility.yml
    permissions:
      contents: read
  publish:
    needs: [gate, validation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked runtime and build tools
        run: |
          python -m pip install -r requirements.lock -r requirements.release.lock
      - name: Build reproducible wheel and checksum
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir dist .
          python -c 'import hashlib,pathlib,tomllib; v=tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]; p=pathlib.Path("dist")/f"llmlang_mvp-{v}-py3-none-any.whl"; (p.parent/"SHA256SUMS").write_text(hashlib.sha256(p.read_bytes()).hexdigest()+"  "+p.name+"\n")'
      - name: Smoke-test installed wheel without editable source import
        run: |
          python -m venv "$RUNNER_TEMP/release-smoke"
          "$RUNNER_TEMP/release-smoke/bin/python" -m pip install -r requirements.lock dist/*.whl
          export PYTHONPATH=
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/release-smoke/bin/python" -c 'import llmlang; assert "site-packages" in llmlang.__file__, llmlang.__file__'
          "$RUNNER_TEMP/release-smoke/bin/python" "$GITHUB_WORKSPACE/scripts/demo_pkg1.py"
          "$RUNNER_TEMP/release-smoke/bin/python" -m llmlang compile-web "$GITHUB_WORKSPACE/examples/web/hello-history.llapp" --out "$RUNNER_TEMP/release-web"
          "$RUNNER_TEMP/release-smoke/bin/python" -c 'import os; from llmlang.web.build import verify_build; assert verify_build(os.environ["RUNNER_TEMP"]+"/release-web")'
      - name: Recheck live milestone, publish once, then close milestone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python -m scripts.publish_release --repository "$GH_REPO"
