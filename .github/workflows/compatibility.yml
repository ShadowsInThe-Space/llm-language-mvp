name: Compatibility baseline
on:
  pull_request:
    branches: [main]
  push:
    branches: ['milestone/**']
  workflow_call:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
        if: ${{ !cancelled() }}
      - run: python -m mypy --no-incremental src
        if: ${{ !cancelled() }}
      - name: Install pinned generated-target typecheck tools
        if: ${{ matrix.python == '3.13' && !cancelled() }}
        run: npm install --prefix "$RUNNER_TEMP/llmlang-types" --no-package-lock --ignore-scripts typescript@5.9.3 @types/react@19.2.2 react@19.2.6 react-dom@19.2.6 jsdom@26.1.0
      - name: Check generated general web target types
        if: ${{ matrix.python == '3.13' && !cancelled() }}
        run: python scripts/check_general_target.py --toolchain "$RUNNER_TEMP/llmlang-types"
      - name: Check actual React SSR and hydration boundaries
        if: ${{ matrix.python == '3.13' && !cancelled() }}
        run: LLMLANG_REACT_TOOLCHAIN="$RUNNER_TEMP/llmlang-types" python -m unittest discover -s tests -p test_general_web_client.py -q
      - name: Check general compiler from isolated installed wheel
        if: ${{ matrix.python == '3.13' && !cancelled() }}
        run: |
          python -m pip install -r requirements.release.lock
          python -m pip wheel --no-build-isolation --no-deps --wheel-dir "$RUNNER_TEMP/general-wheel" .
          python -m venv "$RUNNER_TEMP/general-wheel-venv"
          "$RUNNER_TEMP/general-wheel-venv/bin/python" -m pip install -r requirements.lock "$RUNNER_TEMP"/general-wheel/*.whl
          export PYTHONPATH=
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/general-wheel-venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_general_wheel.py" --examples "$GITHUB_WORKSPACE/examples/web/general"
