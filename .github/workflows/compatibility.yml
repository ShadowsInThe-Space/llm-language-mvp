name: Compatibility baseline
on:
  pull_request:
    branches: [main]
  push:
    branches: ['milestone/**']
  workflow_call:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: python -m ruff check src tests scripts
        if: ${{ !cancelled() }}
      - run: python -m mypy --no-incremental src
        if: ${{ !cancelled() }}
      - name: Install pinned generated-target typecheck tools
        if: ${{ matrix.python == '3.13' && !cancelled() }}
        run: npm install --prefix "$RUNNER_TEMP/llmlang-types" --no-package-lock --ignore-scripts typescript@5.9.3 @types/react@19.2.2
      - name: Check generated general web target types
        if: ${{ matrix.python == '3.13' && !cancelled() }}
        run: python scripts/check_general_target.py --toolchain "$RUNNER_TEMP/llmlang-types"
